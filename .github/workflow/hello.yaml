# workflow
#should have name
name: Hello 

# on tells when the workflow should run (give indentation ny tab )
on:
  workflow_dispatch: 
# jobs 
#should be inside the workflow
#jobs tells the what the workflow should do  there can be one or more jobs , hence we write jobs 
#job is an object need an indentation 
jobs:
# 1st job give an indentation 
  say-hello:
# github action create a ephermal container in ubuntu running (ephernal is short term runnig)
    runs-on: ubuntu-latest 
    #ephernal container will have steps to execute, hence  name those steps and use run: run has the command 
    steps:
      -name: Say hello to everyone
       run: echo "hello dosto"
#steps 
#should be inside the jobs 
#actions 
#should be inside steps 
